<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="src/EditarTarefaStyle.css" />
    <title>📝 TaskFlow - Editar tarefas</title>
  </head>
  <body>
    <header class="header-page">
      <a href="index.html">
        <p id="headerIcon">📝</p>
        <h1 id="headerText">TaskFlow</h1>
      </a>
    </header>
    <main id="main-editar-tarefa">
      <h2>Editar tarefa</h2>
      <form id="form-editar-tarefa" action="" method="get">
        <fieldset>
          <label for="titulo">Título *</label>
          <input
            type="text"
            name="titulo"
            placeholder="Insira o título da tarefa"
            maxlength="50"
            required
          />
          <label for="prazo">Prazo *</label>
          <input name="prazo" type="datetime-local" required />
          <label for="nivel-prioridade">Nivel de prioridade</label>
          <select name="nivel-prioridade">
            <option value="Urgente">Urgente</option>
            <option value="Alto">Alto</option>
            <option value="Medio" selected>Médio</option>
            <option value="Baixo">Baixo</option>
          </select>
          <label name="descricao">Descrição</label>
          <textarea
          name="descricao"
          placeholder="Insira a descrição"
          cols="5"
          ></textarea>
          <label for="cor">Cor acessório da task</label>
          <input id="color-inp" name="cor" type="color">
        </fieldset>
        <button type="submit">Salvar Edição</button>
      </form>
      <button id="tarefa-button" name="minhas-tarefas">Minhas Tarefas</button>
    </main>
    <div></div>
    <footer>© 2026 tarefaFlow</footer>
    <script src="src/CadastrarEditarTarefas.js"></script>
  </body>
</html>

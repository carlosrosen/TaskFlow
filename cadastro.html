<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>📝 TaskFlow - Página Inicial</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <header>
      <p id="headerIcon">📝</p>
      <p id="headerText">TaskFlow</p>
    </header>
    <main id="main-auth">
      <h1>Cadastro do Usuário</h1>
      <form id="auth-form">
        <fieldset id="auth-fieldtext">
          <label for="nome">Nome de usuario:</label>
          <input type="text" id="nome" name="nome" required />
          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" />
          <label for="senha">Senha:</label>
          <input
            type="password"
            id="senha"
            name="senha"
            required
            minlength="6"
          />
          <label for="repete_senha">Repetir senha:</label>
          <input
            type="password"
            id="repete_senha"
            name="repete_senha"
            required
            minlength="6"
          />
        </fieldset>
        <button type="submit" class="cadastrar-button">Cadastrar</button>
      </form>
      <a class="redirect-link" href="login.html">Login &rarr;</a>
    </main>
    <div></div>
    <footer>© 2026 TaskFlow</footer>
  </body>
</html>

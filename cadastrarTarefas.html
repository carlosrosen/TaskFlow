<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="src/CadastrarTarefaStyle.css" />
    <title>📝 TaskFlow - Cadastrar tarefas</title>
  </head>
  <body>
    <header class="header-page">
      <p id="headerIcon">📝</p>
      <h1 id="headerText"><a href="index.html">TaskFlow</a></h1>
    </header>
    <main id="main-cadastrar-tarefa">
      <h2>Cadastrar nova tarefas</h2>
      <form id="form-cadastrar-tarefa" action="" method="get">
        <fieldset>
          <label for="titulo">Título *</label>
          <input
            type="text"
            name="titulo"
            placeholder="Insira o título da tarefa"
            required
          />
          <label for="prazo">Prazo *</label>
          <input name="prazo" type="datetime-local" required />
          <label for="nivel-prioridade">Nivel de prioridade</label>
          <select name="nivel-prioridade">
            <option value="Urgente">Urgente</option>
            <option value="Alto">Alto</option>
            <option value="Medio" selected>Médio</option>
            <option value="Baixo">Baixo</option>
          </select>
          <label name="descricao">Descrição</label>
          <textarea
            name="descricao"
            placeholder="Insira a descrição"
            cols="5"
          ></textarea>
        </fieldset>
        <button type="submit">Cadastrar Tarefa</button>
      </form>
      <button id="tarefa-button" name="minhas-tarefas">Minhas Tarefas</button>
    </main>
    <div></div>
    <footer>© 2026 tarefaFlow</footer>
    <script src="src/script.js" defer></script>
  </body>
</html>

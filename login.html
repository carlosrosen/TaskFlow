<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>📝 TaskFlow - Login</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <header>
      <a href="index.html">
        <p id="headerIcon">📝</p>
        <h1 id="headerText">TaskFlow</h1>
      </a>
    </header>
    <main id="main-auth">
      <h1>Login do Usuário</h1>
      <form id="auth-form">
        <fieldset id="auth-fieldtext">
          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" required />
          <label for="senha">Senha:</label>
          <input type="password" id="senha" name="senha" required />
        </fieldset>
        <button type="submit" class="cadastrar-button">Logar</button>
      </form>
      <a class="redirect-link" href="cadastro.html">Cadastro &rarr;</a>
    </main>
    <div></div>
    <footer>© 2026 TaskFlow</footer>
    <script src="src/login.js"></script>
  </body>
</html>

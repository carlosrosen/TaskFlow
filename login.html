<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>📝 TaskFlow - Página Inicial</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <header>
      <p id="headerIcon">📝</p>
      <p id="headerText">TaskFlow</p>
    </header>
    <main id="main-auth">
      <h1>Login do Usuário</h1>
      <form id="auth-form">
        <fieldset id="auth-fieldtext">
          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" required />

          <label for="senha">Senha:</label>
          <input type="password" id="senha" name="senha" required />
        </fieldset>
        <button type="submit" class="cadastrar-button">Cadastrar</button>
      </form>
      <button class="login-link">Cadastro &rarr;</button>
    </main>
    <div></div>
    <footer>© 2026 TaskFlow</footer>
  </body>
</html>
